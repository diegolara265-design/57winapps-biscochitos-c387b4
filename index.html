<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver de Download</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f2f4f8;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 35px 25px;
      text-align: center;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 18px;
      color: #222222;
      font-size: 32px;
    }

    p {
      margin: 12px 0;
      color: #555555;
      font-size: 17px;
      line-height: 1.6;
    }

    .download-button {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 28px;
      border-radius: 10px;
      background: #1677ff;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .download-button:hover {
      background: #0d5dcc;
    }

    .download-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Driver de Download</h1>

    <p>
      Baixe agora o nosso aplicativo de forma rápida, segura e gratuita.
    </p>

    <p>
      Clique no botão abaixo para iniciar o download diretamente.
    </p>

    <a
      class="download-button"
      href="https://drive.google.com/uc?export=download&id=1pfrfW2KwU7-ZZst07-AoBO7wGDjmSm-L"
    >
      ⬇️ BAIXAR APK
    </a>
  </main>
</body>
</html>
