<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>57 Win Arena - Baixar Aplicativo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0b1220;
      overflow: hidden;
    }

    /* Imagem de fundo ocupando tudo */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.7);
    }

    /* Cartão central com botão */
    .overlay {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      max-width: 420px;
      width: 100%;
    }

    .title {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .subtitle {
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 24px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .btn {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 1.05rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }
    .btn:active {
      transform: translateY(0);
    }

    .info {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <!-- IMAGEM DE FUNDO (ARQUIVO LOCAL) -->
  <img
    class="bg-image"
    src="capa.png"
    alt="57 Win Arena"
  />

  <div class="overlay">
    <h1 class="title">57 Win Arena</h1>
    <p class="subtitle">
      Toque no botão abaixo para baixar o aplicativo agora.
    </p>

    <a
      class="btn"
      href="https://drive.google.com/uc?export=download&id=1ZCi-0m52mIYiul6xK3wacFbsPgodAPdl"
      target="_blank"
      rel="noopener noreferrer"
    >
      Baixar agora
    </a>

    <div class="info">
      Após o download, abra o arquivo para instalar o aplicativo.
    </div>
  </div>
</body>
</html>
